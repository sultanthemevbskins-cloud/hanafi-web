<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160">
  <!-- Base map background -->
  <rect width="400" height="160" fill="#e9e5dc"/>
  <!-- Block fills -->
  <rect x="0" y="0" width="90" height="55" fill="#d6cfc4"/>
  <rect x="110" y="0" width="80" height="55" fill="#d6cfc4"/>
  <rect x="210" y="0" width="70" height="55" fill="#d6cfc4"/>
  <rect x="300" y="0" width="100" height="55" fill="#d6cfc4"/>
  <rect x="0" y="70" width="60" height="50" fill="#d6cfc4"/>
  <rect x="80" y="70" width="100" height="50" fill="#d6cfc4"/>
  <rect x="200" y="70" width="80" height="50" fill="#d6cfc4"/>
  <rect x="300" y="70" width="100" height="50" fill="#d6cfc4"/>
  <rect x="0" y="135" width="120" height="25" fill="#d6cfc4"/>
  <rect x="140" y="135" width="90" height="25" fill="#d6cfc4"/>
  <rect x="250" y="135" width="150" height="25" fill="#d6cfc4"/>
  <!-- Green area (park/water) -->
  <rect x="150" y="72" width="42" height="46" fill="#c6dfc8" rx="3"/>
  <!-- Main roads (horizontal) -->
  <rect x="0" y="58" width="400" height="9" fill="#fff"/>
  <rect x="0" y="123" width="400" height="9" fill="#fff"/>
  <!-- Main roads (vertical) -->
  <rect x="93" y="0" width="9" height="160" fill="#fff"/>
  <rect x="193" y="0" width="9" height="160" fill="#fff"/>
  <rect x="293" y="0" width="9" height="160" fill="#fff"/>
  <!-- Minor roads -->
  <rect x="0" y="28" width="400" height="4" fill="#f0ece3"/>
  <rect x="0" y="100" width="400" height="4" fill="#f0ece3"/>
  <rect x="45" y="0" width="4" height="160" fill="#f0ece3"/>
  <rect x="147" y="0" width="4" height="160" fill="#f0ece3"/>
  <rect x="247" y="0" width="4" height="160" fill="#f0ece3"/>
  <rect x="347" y="0" width="4" height="160" fill="#f0ece3"/>
  <!-- Location pin -->
  <circle cx="200" cy="72" r="14" fill="#007b85" opacity="0.25"/>
  <path d="M200 52 C193 52 187 58 187 65 C187 75 200 87 200 87 C200 87 213 75 213 65 C213 58 207 52 200 52Z" fill="#007b85"/>
  <circle cx="200" cy="65" r="5" fill="white"/>
  <!-- Label -->
  <rect x="100" y="108" width="200" height="26" rx="4" fill="white" opacity="0.85"/>
  <text x="200" y="125" text-anchor="middle" font-family="Poppins,sans-serif" font-size="11" font-weight="600" fill="#102a2e">Bay Avenue, Penang</text>
</svg>
